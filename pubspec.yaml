name: stranger_connect
description: Connect with strangers by shaking your phone.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.4.1
  firebase_storage: ^12.4.1

  sensors_plus: ^6.1.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_animate: ^4.5.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
